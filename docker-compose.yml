version: '3.8'
services:
  strm-transformer:
    build: .
    container_name: strm-transformer
    environment:
      - STREAM_DOMAIN=${STREAM_DOMAIN:-localhost}
      - TOKEN_SECRET=${TOKEN_SECRET:-super-secret-key}
    volumes:
      - ${MEDIA_DIR:-./media}:/media:ro
      - ${STRM_DIR:-./strm-output}:/strm-output:rw

  https-media-server:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ${MEDIA_DIR:-./media}:/media:ro
