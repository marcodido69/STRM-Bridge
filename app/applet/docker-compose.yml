version: '3.8'
services:
  strm-transformer:
    build: .
    container_name: strm-transformer
    restart: unless-stopped
    environment:
      - STREAM_DOMAIN=${STREAM_DOMAIN:-localhost}
      - MEDIA_DIR=/media
      - STRM_DIR=/strm-output
    volumes:
      - ${MEDIA_DIR:-./media}:/media:ro
      - ${STRM_DIR:-./strm-output}:/strm-output:rw

  https-media-server:
    image: nginx:alpine
    container_name: nginx-https-stream
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MEDIA_DIR:-./media}:/media:ro
EOF
